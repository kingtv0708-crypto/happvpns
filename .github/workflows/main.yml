name: Build Happ VPN APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Extract project ZIP
    run: |
      unzip HappVPN_Android_Project.zip -d extracted

  - name: Build APK
    run: |
      cd extracted/HappVPN
      gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: HappVPN-debug-apk
      path: extracted/HappVPN/app/build/outputs/apk/debug/*.apk
